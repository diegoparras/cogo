name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **If this is a security problem, please don't file it here** —
        see [SECURITY.md](https://github.com/diegoparras/cogo/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Run `cogo serve -http :8080`
        2. Open the Vault
        3. …
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running COGO?
      options:
        - Docker
        - Binary (go install / release)
        - MCP over stdio
        - MCP over HTTP
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`cogo -h` prints it. If you're on Docker, the image tag."
  - type: textarea
    id: note
    attributes:
      label: The note's frontmatter (only if this is about a color)
      description: >
        A note's color is a function of its frontmatter, so pasting it is usually enough to
        reproduce. Please remove anything sensitive first.
      render: yaml
