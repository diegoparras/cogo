name: image

# Build the scratch image and publish it to GHCR on every push to main and on
# tags — now with a verifiable supply chain: SLSA build provenance + a keyless
# Sigstore signature on the image, and (on version tags) signed binaries with
# checksums. Anyone can prove an artifact really came from this repo's CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Rebuild semanal aunque no haya commits: la imagen es un binario estático
  # sobre la stdlib de Go, y las CVE de la stdlib se arreglan con un parche del
  # toolchain. Sin esto la imagen publicada envejecía hasta el próximo commit —
  # y govulncheck, abajo, rompe el build si el parche no alcanzó.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write # create GitHub Releases on tags
  packages: write # push to GHCR
  id-token: write # keyless cosign + provenance (Sigstore OIDC)
  attestations: write # SLSA build-provenance attestation

jobs:
  # Los tests corren ANTES de publicar y el build depende de ellos: una imagen
  # firmada que no pasa su propia suite es una firma sobre algo roto.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # este job solo lee; los permisos de publicar los tiene build-push
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Un solo lugar para la versión de Go: go.mod. Antes el CI testeaba
          # con 1.25 y la imagen se compilaba con 1.26.
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          sin_formato=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$sin_formato" ]; then
            echo "estos archivos no están formateados:"; echo "$sin_formato"; exit 1
          fi
      - name: go generate deja el árbol limpio
        run: |
          go generate ./...
          sucio=$(git status --porcelain)
          if [ -n "$sucio" ]; then
            echo "hay archivos generados sin regenerar — corré 'go generate ./...':"
            echo "$sucio"
            git diff
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1

      # Vulnerabilidades ALCANZABLES desde el código, en deps y en la stdlib.
      # Es lo que convierte "hay un parche de Go" en "el build no pasa hasta que
      # lo tomes" — y con el rebuild semanal, lo toma solo.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # El visor es JavaScript embebido con go:embed: no pasa por ningún
      # compilador, así que un error de sintaxis se despliega tal cual y deja la
      # pantalla EN BLANCO. No lo atrapa ningún test de Go, y el binario compila
      # perfecto. Pasó una vez; este chequeo cuesta un segundo.
      - name: el javascript del visor parsea
        run: |
          for f in internal/web/assets/*.js; do
            node --check "$f" || { echo "sintaxis rota en $f"; exit 1; }
          done

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # SLSA build provenance: a signed attestation of how/where the image was
      # built, attached to the image in GHCR. Verify with `gh attestation verify`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Keyless Sigstore signature so anyone can prove the image is authentic:
      #   cogo="ghcr.io/diegoparras/cogo"
      #   cosign verify $cogo --certificate-identity-regexp \
      #     "https://github.com/diegoparras/cogo/.github/workflows/.+" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

  # On version tags: cross-compile the single static binary, checksum it, sign the
  # checksums (keyless), and publish a GitHub Release. Verifiable local downloads.
  release-binaries:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build static binaries + checksums
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -buildvcs=false \
              -ldflags="-s -w" -o "dist/cogo-$os-$arch$ext" ./cmd/cogo
          done
          cd dist && sha256sum cogo-* > SHA256SUMS

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
