version: 2
updates:
  # Go modules. COGO has few dependencies on purpose, so this stays quiet.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The actions in the release workflow sign images and publish binaries: keeping them
  # current matters more than the Go deps. They are pinned by SHA in docker.yml, so
  # without this nobody would ever move them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # La imagen base del build (golang:1.26): los parches de la stdlib llegan por acá
  # y por el rebuild semanal del workflow.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
